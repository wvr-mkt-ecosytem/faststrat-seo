# Render blueprint para FastStrat SEO Dashboard (servicio web Next.js).
# El cron semanal NO va aquí porque Render no permite cron en plan free —
# se ejecuta desde GitHub Actions (.github/workflows/weekly.yml), también gratis.
# Las variables de entorno se configuran en el dashboard de Render.
services:
  - type: web
    name: faststrat-seo
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
