# Render blueprint para FastStrat SEO Dashboard (servicio web Next.js).
# El cron semanal NO va aquí porque Render no permite cron en plan free —
# se ejecuta desde GitHub Actions (.github/workflows/weekly.yml), también gratis.
# Las variables de entorno se configuran en el dashboard de Render.
services:
  - type: web
    name: faststrat-seo
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    # Los commits que solo tocan contenido generado (blogs, ideas, portadas)
    # NO disparan redeploy — así generar un artículo no reinicia la instancia.
    buildFilter:
      ignoredPaths:
        - "content/**"
        - "data/**"
        - "public/covers/**"
    envVars:
      # sync:false obliga a Render a pedirlas al desplegar el blueprint.
      # Sin esto, un servicio recreado arrancaba sin autenticación.
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: 22
