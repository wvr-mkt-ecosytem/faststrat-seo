# Render blueprint para FastStrat SEO Dashboard.
# Servicio web (Next.js) + cron job semanal — todo en tier gratis.
# Las variables de entorno se configuran en el dashboard de Render.
services:
  - type: web
    name: faststrat-seo
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22

  - type: cron
    name: faststrat-seo-weekly
    runtime: node
    plan: free
    region: oregon
    # Lunes a las 10:00 UTC (= 5:00 AM Bogotá / 4:00 AM CDMX)
    schedule: "0 10 * * 1"
    buildCommand: 'echo "no build needed"'
    # Llama al endpoint /api/weekly del propio servicio web.
    # APP_BASE_URL y WEEKLY_SECRET se configuran en el dashboard de Render.
    startCommand: 'curl -fsS -X POST -H "x-weekly-secret: $WEEKLY_SECRET" "$APP_BASE_URL/api/weekly"'
