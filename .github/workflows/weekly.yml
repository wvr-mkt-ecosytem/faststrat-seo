name: Weekly content batch

# El trabajo de los lunes corre AQUÍ, no en Render.
#
# Antes este workflow le hacía curl a Render y Render se moría: en el plan
# gratis el agente se come la CPU, el health check no responde en 5 segundos y
# la instancia se reinicia a mitad del trabajo. Las tres últimas corridas
# fallaron así, y cada diagnóstico terminaba en una variable de entorno de
# Render mal puesta —secret de Google caducado, clave de Resend muerta— porque
# el trabajo dependía de un servidor que nadie estaba mirando.
#
# Ahora se corre la misma librería directamente, con los secrets de GitHub.
# Render se queda solo con el panel, que es leer, que es lo que un plan gratis
# sí puede hacer.

permissions:
  contents: write

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      parte:
        description: "Qué correr"
        type: choice
        options: ["todo", "solo-ideas", "solo-analisis"]
        default: "todo"

jobs:
  semanal:
    runs-on: ubuntu-latest
    # El agente tarda: unos 10 minutos las ideas y otros 10 el análisis. El
    # margen es amplio a propósito, porque quedarse corto significa perder el
    # trabajo entero después de haberlo pagado.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Ideas y análisis
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_MEASUREMENT_REFRESH_TOKEN: ${{ secrets.GOOGLE_MEASUREMENT_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CLIENTE_NOMBRE: ${{ vars.CLIENTE_NOMBRE }}
          CLIENTE_DOMINIO: ${{ vars.CLIENTE_DOMINIO }}
          CLIENTE_DOMINIO_APP: ${{ vars.CLIENTE_DOMINIO_APP }}
          CLIENTE_AUTOR: ${{ vars.CLIENTE_AUTOR }}
          CLIENTE_QUE_HACE: ${{ vars.CLIENTE_QUE_HACE }}
        run: |
          case "${{ inputs.parte }}" in
            solo-ideas)    node scripts/semanal.mjs --solo-ideas ;;
            solo-analisis) node scripts/semanal.mjs --solo-analisis ;;
            *)             node scripts/semanal.mjs ;;
          esac

      - name: Guardar ideas e informe
        # Siempre, incluso si una de las dos partes falló: la otra pudo haber
        # producido trabajo real, y perderlo por el fallo de su compañera es
        # exactamente lo que pasaba antes.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ideas data/reports data/trends 2>/dev/null || true
          git diff --cached --quiet && { echo "No hay nada que guardar."; exit 0; }
          git commit -m "[auto] tanda semanal"
          git pull --rebase origin main
          git push origin HEAD:main
